<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace; font-size: 15px; }
    .prompt { fill: #64b5f6; }
    .out { fill: #e3f2fd; }
    .dim { fill: #4f7cac; }
    #c1 rect { animation: t1 10s steps(33, end) infinite; }
    #c2 rect { animation: t2 10s steps(46, end) infinite; }
    #p3 { animation: p3 10s steps(1, end) infinite; }
    #cursor { animation: blink 1s steps(1, end) infinite; }
    @keyframes t1 { 0%, 4% { width: 0; } 26%, 92% { width: 340px; } 96%, 100% { width: 0; } }
    @keyframes t2 { 0%, 32% { width: 0; } 56%, 92% { width: 470px; } 96%, 100% { width: 0; } }
    @keyframes p3 { 0%, 60% { opacity: 0; } 61%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
  <defs>
    <clipPath id="c1"><rect x="30" y="52" width="0" height="26" /></clipPath>
    <clipPath id="c2"><rect x="30" y="84" width="0" height="26" /></clipPath>
  </defs>

  <rect x="1" y="1" width="798" height="178" rx="12" fill="#0a192f" stroke="#4f7cac" stroke-width="2" />
  <path d="M1 13 a12 12 0 0 1 12 -12 h774 a12 12 0 0 1 12 12 v27 h-798 z" fill="#0B2447" />
  <circle cx="26" cy="21" r="6" fill="#4f7cac" />
  <circle cx="48" cy="21" r="6" fill="#64b5f6" />
  <circle cx="70" cy="21" r="6" fill="#1e88e5" />
  <text x="400" y="26" text-anchor="middle" class="mono dim" font-size="12">filipe@github: ~</text>

  <g clip-path="url(#c1)">
    <text x="30" y="70" class="mono"><tspan class="prompt">$</tspan><tspan class="out"> git commit -m "to be continued"</tspan></text>
  </g>
  <g clip-path="url(#c2)">
    <text x="30" y="102" class="mono out">[main 4f7cac0] still learning, still building</text>
  </g>
  <g id="p3" opacity="0">
    <text x="30" y="134" class="mono prompt">$</text>
    <rect id="cursor" x="48" y="120" width="9" height="17" fill="#64b5f6" />
  </g>
</svg>
